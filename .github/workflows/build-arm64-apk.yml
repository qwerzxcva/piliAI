name: Build ARM64 APK (Kotlin + Rust)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_NDK_VERSION: '30.0.16248370'
  TERM: dumb

jobs:
  build-rust-native:
    name: Build Rust native library (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android
          components: rustfmt, clippy

      - name: Test quality gate
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      # 审核54：Rust 依赖缓存——避免每次 CI 全量重编
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: arm64-release

      # 审核226：runner 无 meson/ninja（pkg-config/autoconf 预装有）。native 依赖链
      # （mbedtls→…→mpv）的 meson 组件必须先装齐，脚本拒绝自动安装。
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config autoconf automake libtool xz-utils bzip2
          meson --version && ninja --version

      - name: Setup Android SDK & NDK
        run: |
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | $SDKMANAGER --sdk_root=$ANDROID_HOME licenses > /dev/null 2>&1 || true
          $SDKMANAGER --sdk_root=$ANDROID_HOME "ndk;${{ env.ANDROID_NDK_VERSION }}" 2>&1
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Validate pinned native dependency plan
        run: python3 scripts/build_native_dependencies.py --plan --lock scripts/native-dependencies.lock.json

      - name: Build pinned native dependencies
        run: |
          # 这一段绝不能被 bash -e 提前杀掉：先关掉 errexit，失败也要把
          # build.log 与各 meson-log.txt 完整打进日志，便于无 admin 的定位。
          set +e
          python3 scripts/build_native_dependencies.py --lock scripts/native-dependencies.lock.json
          status=$?
          if [ $status -ne 0 ]; then
            echo "=== build.log tail ==="
            LOG=".aharou/native-build/logs/build.log"
            [ -f "$LOG" ] && tail -50 "$LOG"
            # 审核226i：无 admin 拉不到 job 日志，把报错行转成 ::error:: 注解（API 可读）
            if [ -f "$LOG" ]; then
              grep -aE 'ERROR|Error|error:|FATAL|failed|FAILED|BUILT|Traceback|BuildFailure|command failed' "$LOG" | tail -40 | while IFS= read -r L; do
                echo "::error::${L:0:300}"
              done
            fi
            for MLOG in $(find .aharou/native-build -name 'meson-log.txt' 2>/dev/null); do
              echo "=== $MLOG tail ==="
              tail -60 "$MLOG"
              grep -aE 'ERROR|error:|not found|undefined' "$MLOG" | tail -10 | while IFS= read -r L; do
                echo "::error::[meson] ${L:0:300}"
              done
            done
            # 组件 configure 日志（ffmpeg 等）同样兜底输出
            for CLOG in $(find .aharou/native-build -name 'config.log' -o -name 'ffbuild/config.log' 2>/dev/null); do
              echo "=== $CLOG tail ==="
              tail -40 "$CLOG"
            done
          fi
          exit $status


      - name: Build Rust library for arm64-v8a
        run: |
          cd rust
          export ANDROID_NDK_HOME="${{ env.ANDROID_NDK_HOME }}"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export AR=llvm-ar
          export CC=aarch64-linux-android36-clang
          export CXX=aarch64-linux-android36-clang++
          export CFLAGS="--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export LDFLAGS="-Wl,-z,max-page-size=16384"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android36-clang
          export RUSTFLAGS="-C link-arg=-landroid -C link-arg=-llog -C link-arg=-lunwind -C link-arg=-Wl,-z,max-page-size=16384"
          export MPV_PREFIX="$GITHUB_WORKSPACE/.aharou/native-build/prefix/arm64"

          cargo ndk -t arm64-v8a --platform 36 -o ../android/app/src/main/jniLibs build --locked --release 2>&1
          find "$MPV_PREFIX/lib" -maxdepth 1 \( -type f -o -type l \) -name '*.so*' -exec cp -L {} ../android/app/src/main/jniLibs/arm64-v8a/ \;
          python3 ../scripts/verify_native_artifacts.py ../android/app/src/main/jniLibs/arm64-v8a \
            --require-library libpilinara_native.so \\
            --require-library libmpv.so \\
            --require-library libavcodec.so \\
            --require-library libavformat.so \\
            --require-library libavutil.so \\
            --require-library libswscale.so \\
            --require-library libswresample.so
          llvm-nm -D ../android/app/src/main/jniLibs/arm64-v8a/libpilinara_native.so | \
            grep -E 'Java_com_example_piliai_playback_backend_RustGpuNextBridge_native(Create|Initialize|SetOption)$'

      # 审核90：Rust 单元测试与 lint 门禁（此前 CI 从不校验，坏代码可直接合并）
      - name: Rust test & clippy
        run: |
          cd rust
          cargo fmt --all -- --check
          cargo test --locked --all-targets 2>&1
          cargo clippy --locked --all-targets -- -D warnings 2>&1

      - name: Upload Rust artifact
        uses: actions/upload-artifact@v5
        with:
          name: rust-lib-arm64
          path: android/app/src/main/jniLibs/arm64-v8a/
          retention-days: 7
          if-no-files-found: error

  build-apk:
    name: Build APK (Android 16 ARM64)
    needs: [build-rust-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Download Rust library
        uses: actions/download-artifact@v5
        with:
          name: rust-lib-arm64
          path: android/app/src/main/jniLibs/arm64-v8a

      - name: Setup Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" \
            "build-tools;36.0.0" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Build Debug APK
        run: |
          chmod +x ./android/gradlew
          cd android
          ./gradlew :app:assembleDebug --build-cache --no-daemon --stacktrace 2>&1
          for regression in run_playback_headers_regression.py run_playback_session_regression.py run_playback_network_regression.py run_playback_speed_regression.py run_pip_params_regression.py run_owned_resolver_regression.py run_subscription_search_regression.py run_subscription_link_regression.py run_jsonpath_regression.py run_rss_regression.py run_scraper_regression.py run_todaywatch_regression.py; do
            PYTHONDONTWRITEBYTECODE=1 python3 "../tests/$regression" || exit 1
          done
          ./gradlew :app:lintDebug --build-cache --no-daemon 2>&1
          # 不猜报告路径：构建后按实际产物定位并校验存在。
          REPORT=$(find .. -path '*/reports/lint-results-debug.xml' -print -quit)
          [ -n "$REPORT" ] || { echo "::error::Lint XML report not found"; exit 1; }
          python3 ../tests/check_lint_report.py "$REPORT"
          echo "=== Build complete ==="
          echo "Current dir: $(pwd)"
          echo "Finding APK files..."
          find . -name "*.apk" -type f 2>/dev/null || echo "No APK found with find"
          echo "Listing outputs..."
          ls -la app/build/outputs/ 2>/dev/null || true
          ls -la app/build/outputs/apk/ 2>/dev/null || true
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-debug
          path: |
            build/app/reports/lint-results-debug.xml
            build/app/reports/lint-results-debug.html
            build/app/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

      - name: Verify packaged ARM64 libraries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          apks = sorted(Path('build/app/outputs/apk/debug').glob('*.apk'))
          if not apks:
              raise SystemExit('No debug APK produced in the configured build directory')
          for apk in apks:
              with zipfile.ZipFile(apk) as archive:
                  libraries = [entry.filename for entry in archive.infolist()
                               if entry.filename.startswith('lib/') and entry.filename.endswith('.so')]
                  if not libraries:
                      raise SystemExit(f'Native libraries missing from {apk}')
                  invalid = [name for name in libraries if not name.startswith('lib/arm64-v8a/')]
                  if invalid:
                      raise SystemExit('Non-ARM64 native libraries packaged: ' + ', '.join(invalid))
                  if 'lib/arm64-v8a/libpilinara_native.so' not in libraries:
                      raise SystemExit(f'Rust native library missing from {apk}')
              print(f'PASS packaged ABI: {apk}, {len(libraries)} ARM64 libraries')
          PY

      - name: Collect verified debug APK files
        run: |
          mkdir -p apk_output
          cp build/app/outputs/apk/debug/*.apk apk_output/
          ls -la apk_output/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: pilinara-debug
          path: apk_output/
          retention-days: 7
          if-no-files-found: error

  verify:
    name: Verify Build
    needs: [build-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts/
      
      - name: Display results
        run: |
          echo "==================================="
          echo "  PiliNara ARM64 Build Summary"
          echo "==================================="
          echo ""
          echo "=== Artifacts ==="
          find artifacts -type f \( -name "*.apk" -o -name "*.so" \) 2>/dev/null | head -20
          echo ""
          echo "=== APK Files ==="
          ls -la artifacts/pilinara-debug/ 2>/dev/null || echo "No APK found"
          echo ""
          echo "=== Native Library ==="
          ls -la artifacts/rust-lib-arm64/ 2>/dev/null || echo "No .so found"
          echo ""
          echo "==================================="
          echo "  Build Status: SUCCESS ✅"
          echo "==================================="
